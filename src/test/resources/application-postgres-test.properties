# Exclusivo do PostgreSQL descartável de CI; nunca apontar para HOMOL.
spring.datasource.url=${CI_DATABASE_URL:jdbc:postgresql://localhost:55436/gamificacao_ci}
spring.datasource.username=${CI_DATABASE_USER:gamificacao}
spring.datasource.password=${CI_DATABASE_PASSWORD:gamificacao_ci}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
