name: grupo5-jenkins

services:
  docker:
    image: docker:28.0.4-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker_certs:/certs/client
      - docker_data:/var/lib/docker
      # Mesmo caminho nos dois contêineres para os bind mounts do Compose.
      - jenkins_home:/var/jenkins_home
    ports:
      - "127.0.0.1:${HOMOL_API_PORT:-8082}:${HOMOL_API_PORT:-8082}"
      - "127.0.0.1:${HOMOL_FRONTEND_PORT:-5174}:${HOMOL_FRONTEND_PORT:-5174}"
      - "127.0.0.1:${HOMOL_PGADMIN_PORT:-5051}:${HOMOL_PGADMIN_PORT:-5051}"
      - "127.0.0.1:${HOMOL_PROMETHEUS_PORT:-9091}:${HOMOL_PROMETHEUS_PORT:-9091}"
      - "127.0.0.1:${HOMOL_GRAFANA_PORT:-3001}:${HOMOL_GRAFANA_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "docker --host unix:///var/run/docker.sock info > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  jenkins:
    build: ./jenkins
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      # Daemon interno publica na interface do contêiner DinD;
      # o Compose externo acima restringe o acesso ao localhost do computador.
      HOMOL_BIND_ADDRESS: 0.0.0.0
      HOMOL_API_PORT: ${HOMOL_API_PORT:-8082}
      HOMOL_FRONTEND_PORT: ${HOMOL_FRONTEND_PORT:-5174}
      HOMOL_PGADMIN_PORT: ${HOMOL_PGADMIN_PORT:-5051}
      HOMOL_PROMETHEUS_PORT: ${HOMOL_PROMETHEUS_PORT:-9091}
      HOMOL_GRAFANA_PORT: ${HOMOL_GRAFANA_PORT:-3001}
      HOMOL_DATABASE_PASSWORD: ${HOMOL_DATABASE_PASSWORD:-gamificacao_homol}
      HOMOL_PGADMIN_EMAIL: ${HOMOL_PGADMIN_EMAIL:-admin@grupo5.dev}
      HOMOL_PGADMIN_PASSWORD: ${HOMOL_PGADMIN_PASSWORD:-admin_homol}
      HOMOL_GRAFANA_USER: ${HOMOL_GRAFANA_USER:-admin}
      HOMOL_GRAFANA_PASSWORD: ${HOMOL_GRAFANA_PASSWORD:-admin_homol}
    volumes:
      - jenkins_home:/var/jenkins_home
      - docker_certs:/certs/client:ro
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8081}:8080"
    depends_on:
      docker:
        condition: service_healthy

volumes:
  jenkins_home:
  docker_certs:
  docker_data:
